name: Deploy Backend CRUD to GitHub Pages

on:
  push:
    branches:
      - feat/backend-crud-supabase
    paths:
      - "proyectos/backend-crud/**"
      - ".github/workflows/deploy-backend-crud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp proyectos/backend-crud/index.html proyectos/backend-crud/app.js proyectos/backend-crud/styles.css proyectos/backend-crud/supabase-config.js _site/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
